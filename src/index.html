<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>啤酒发酵工厂 · 生产流程三维课件</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">

  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div id="stageVignette"></div>
  </div>

  <header id="topbar">
    <div class="brand">
      <div class="mark"><i></i><i></i><i></i></div>
      <div class="brand-txt">
        <h1>啤酒发酵工厂</h1>
        <p>高中生物 · 细胞呼吸与发酵工程 · 生产流程三维演示</p>
      </div>
    </div>
    <div class="tb-right">
      <div class="viewseg" id="viewSeg">
        <button data-v="factory" class="on">工厂全景</button>
        <button data-v="process">流程跟随</button>
      </div>
      <button class="icon-btn" id="btnHelp" title="使用说明">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 2.4c-.6.2-.8.7-.8 1.3v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="icon-btn" id="btnReset" title="回到全景">
        <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.2 4.2v5.2h5.2"/></svg>
      </button>
    </div>
  </header>

  <nav id="rail">
    <button class="rail-btn on" data-view="stage" title="工厂全景">
      <svg viewBox="0 0 24 24"><path d="M3 20h18"/><rect x="5" y="9" width="5" height="11" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
      <span>工厂</span>
    </button>
    <button class="rail-btn" data-view="cell" title="细胞呼吸">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3.6v2.2M12 18.2v2.2M3.6 12h2.2M18.2 12h2.2"/></svg>
      <span>呼吸</span>
    </button>
    <button class="rail-btn" data-view="engine" title="发酵工程">
      <svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V4.5M16 7V4.5"/><path d="M8 13h3M13 13h3M8 16.5h3"/></svg>
      <span>工程</span>
    </button>
    <button class="rail-btn" data-view="sim" title="条件控制">
      <svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-6"/><path d="M2.5 19h19"/></svg>
      <span>条件</span>
    </button>
    <button class="rail-btn" data-view="quiz" title="课堂检测">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h11l3.5 3.5V19.5H5z"/><path d="M9 10h6M9 13.5h6M9 17h3.5"/></svg>
      <span>检测</span>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-btn" id="btnCellMode" title="发酵罐分子视角">
      <svg viewBox="0 0 24 24"><path d="M9 3h6v3l-1.2 1.4v9.2c0 1.9-1.4 3.4-3.3 3.4S7.2 18.5 7.2 16.6V7.4L6 6V3"/><circle cx="12" cy="14" r="1.4"/></svg>
      <span>分子</span>
    </button>
  </nav>

  <div id="heroTitle">
    <div class="ht-no" id="htNo">01</div>
    <div class="ht-main">
      <h2 id="htName">原料 · 发芽</h2>
      <p id="htLead">让种子自己造出分解淀粉的工具。</p>
    </div>
  </div>

  <div id="hud">
    <div class="hud-cap">产线实时参数</div>
    <div class="hud-row" id="hudRow"></div>
  </div>

  <aside id="panel">
    <div class="panel-inner" id="panelInner"></div>
  </aside>

  <footer id="timeline">
    <div class="tl-ctrl">
      <button id="btnPrev" class="round-btn" title="上一工段">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="btnPlay" class="round-btn" title="自动巡演">
        <svg viewBox="0 0 24 24" class="ico-play"><path d="M8 5.5l10 6.5-10 6.5z" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 24 24" class="ico-pause" style="display:none"><path d="M9 5v14M15 5v14"/></svg>
      </button>
      <button id="btnNext" class="round-btn" title="下一工段">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="tl-track" id="tlTrack"></div>
    <div class="tl-side">
      <div class="tl-count"><b id="tlNow">01</b><span>/ 09</span></div>
      <div class="tl-hint">← → 切换工段</div>
    </div>
  </footer>

  <div id="overlay" hidden>
    <div class="ov-sheet">
      <header class="ov-head">
        <div>
          <h3 id="ovTitle">细胞呼吸</h3>
          <p id="ovSub"></p>
        </div>
        <button class="ov-close" id="ovClose">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="ov-body" id="ovBody"></div>
    </div>
  </div>

  <div id="cellCard" hidden>
    <div class="cc-head">
      <span class="cc-dot"></span>
      <b>发酵罐内的分子事件</b>
      <button id="ccClose">收起</button>
    </div>
    <div class="cc-eq" id="ccEq"></div>
    <div class="cc-note" id="ccNote"></div>
  </div>

  <div id="loader">
    <div class="ld-mark"><i></i><i></i><i></i><i></i></div>
    <div class="ld-txt">正在装配产线<span class="ld-dots"><i>.</i><i>.</i><i>.</i></span></div>
    <div class="ld-bar"><span id="ldFill"></span></div>
    <div class="ld-sub">程序化建模 · 无外部模型依赖</div>
  </div>

</div>

<script>
/*__THREE__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
